<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #070b14; overflow: hidden; }
  #bg-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #flash {
    position: fixed; inset: 0; background: #eaf2ff; opacity: 0;
    pointer-events: none; z-index: 3; transition: opacity 90ms ease-out;
  }
  #fog-veil {
    position: fixed; inset: 0; background:
      radial-gradient(120% 80% at 50% 120%, rgba(200,208,216,0.0), rgba(200,208,216,0.55));
    opacity: 0; pointer-events: none; z-index: 2; transition: opacity 1.2s ease;
    mix-blend-mode: screen;
  }
  #loc {
    position: fixed; top: 14px; right: 14px; color: rgba(180,200,225,0.78);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 12px; letter-spacing: .2px;
    background: rgba(5,8,14,0.42); padding: 6px 11px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(6px);
    pointer-events: none; z-index: 4; max-width: 62vw; text-align: right;
  }
  #fallback {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: #9fb3cc; font-family: system-ui, sans-serif; font-size: 14px;
    background: linear-gradient(160deg,#0b1730,#1a2742); z-index: 5; text-align:center; padding: 24px;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
        onerror="document.getElementById('fallback').style.display='flex';document.getElementById('loc').textContent='Three.js 加载失败（可能为网络或 CSP 限制）';"></script>
</head>
<body>
<canvas id="bg-canvas"></canvas>
<div id="flash"></div>
<div id="fog-veil"></div>
<div id="loc">正在获取当地实时天气…</div>
<div id="fallback">当前环境不支持 WebGL，已降级为静态背景。</div>
<script>
(function () {
  "use strict";

  // ---------- 软圆精灵纹理（云/雪/尘/星/日月共用，按颜色着色） ----------
  function makeSprite() {
    const c = document.createElement("canvas");
    c.width = c.height = 64;
    const g = c.getContext("2d");
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0.0, "rgba(255,255,255,1)");
    grd.addColorStop(0.4, "rgba(255,255,255,0.55)");
    grd.addColorStop(1.0, "rgba(255,255,255,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  }

  let renderer, scene, camera, skyScene, skyCam, skyMat;
  const canvas = document.getElementById("bg-canvas");
  const locEl = document.getElementById("loc");
  const flashEl = document.getElementById("flash");
  const fogEl = document.getElementById("fog-veil");

  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    if (!renderer || !renderer.getContext()) throw new Error("no-webgl-context");
  } catch (e) {
    const fb = document.getElementById("fallback");
    if (fb) fb.style.display = "flex";
    return;
  }

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.autoClear = false;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 2.5, 16);
  camera.lookAt(0, 0, -6);

  // ---------- 天空渐变（独立正交场景，先画） ----------
  skyScene = new THREE.Scene();
  skyCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  skyMat = new THREE.ShaderMaterial({
    depthTest: false, depthWrite: false,
    uniforms: {
      uTop: { value: new THREE.Color(0.13, 0.16, 0.22) },
      uBottom: { value: new THREE.Color(0.30, 0.35, 0.42) },
    },
    vertexShader: [
      "varying vec2 vUv;",
      "void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }"
    ].join("\n"),
    fragmentShader: [
      "uniform vec3 uTop; uniform vec3 uBottom; varying vec2 vUv;",
      "void main(){",
      "  float t = smoothstep(0.0, 1.0, vUv.y);",
      "  vec3 col = mix(uBottom, uTop, t);",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n")
  });
  skyScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), skyMat));

  // ---------- 通用：软精灵点系统 ----------
  const sprite = makeSprite();
  function softPoints(count, area, yBase, ySpan, sizeBase, color, opacity) {
    const geo = new THREE.BufferGeometry();
    const pos = new Float32Array(count * 3);
    const aSpeed = new Float32Array(count);
    const aOffset = new Float32Array(count);
    const aRand = new Float32Array(count);
    for (let i = 0; i < count; i++) {
      pos[i * 3] = (Math.random() - 0.5) * area[0];
      pos[i * 3 + 1] = yBase + Math.random() * ySpan;
      pos[i * 3 + 2] = (Math.random() - 0.5) * area[1] - 10;
      aSpeed[i] = Math.random();
      aOffset[i] = Math.random();
      aRand[i] = Math.random();
    }
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setAttribute("aSpeed", new THREE.BufferAttribute(aSpeed, 1));
    geo.setAttribute("aOffset", new THREE.BufferAttribute(aOffset, 1));
    geo.setAttribute("aRand", new THREE.BufferAttribute(aRand, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.NormalBlending,
      uniforms: {
        uTime: { value: 0 }, uIntensity: { value: 0.5 }, uOpacity: { value: opacity },
        uSize: { value: sizeBase }, uColor: { value: new THREE.Color(color) },
        uTex: { value: sprite }, uYBase: { value: yBase }, uYSpan: { value: ySpan }
      },
      vertexShader: [
        "uniform float uTime, uIntensity, uSize, uYBase, uYSpan;",
        "attribute float aSpeed, aOffset, aRand;",
        "varying float vRand, vA;",
        "void main(){",
        "  vec3 p = position;",
        "  float fall = mod(uTime*(0.12+aSpeed*0.35)+aOffset, 1.0);",
        "  p.y = uYBase + uYSpan - fall*uYSpan;",
        "  p.x += sin(uTime*0.4 + aOffset*6.2831) * 1.3;",
        "  p.z += cos(uTime*0.3 + aOffset*6.2831) * 0.6;",
        "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
        "  float sz = mix(uSize*0.6, uSize*1.5, uIntensity);",
        "  gl_PointSize = sz * (300.0 / -mv.z);",
        "  gl_Position = projectionMatrix * mv;",
        "  vRand = aRand;",
        "  vA = mix(0.45, 1.0, uIntensity);",
        "}"
      ].join("\n"),
      fragmentShader: [
        "uniform sampler2D uTex; uniform vec3 uColor; uniform float uIntensity, uOpacity;",
        "varying float vRand, vA;",
        "void main(){",
        "  if (vRand > 0.15 + uIntensity*0.85) discard;",
        "  vec4 t = texture2D(uTex, gl_PointCoord);",
        "  gl_FragColor = vec4(uColor, t.a * vA * uOpacity);",
        "}"
      ].join("\n")
    });
    const pts = new THREE.Points(geo, mat);
    pts.frustumCulled = false;
    scene.add(pts);
    return pts;
  }

  // 雪
  const snow = softPoints(2600, [60, 40], 12, 28, 7.0, new THREE.Color(0.92, 0.96, 1.0), 0.0);
  // 云（大柔团，灰色，高位漂移）
  const clouds = softPoints(140, [120, 30], 14, 8, 46.0, new THREE.Color(0.66, 0.71, 0.80), 0.0);
  clouds.material.uniforms.uSize.value = 46.0;
  // 尘埃（晴日暖色微尘）
  const dust = softPoints(500, [70, 30], 2, 22, 3.0, new THREE.Color(1.0, 0.86, 0.62), 0.0);
  // 星点（晴夜）
  const stars = softPoints(700, [140, 60], 6, 30, 4.0, new THREE.Color(0.95, 0.97, 1.0), 0.0);

  // ---------- 雨（程序化竖向拖尾，密度/粗细/速度/倾角随强度） ----------
  const RCOUNT = 7000;
  const rgeo = new THREE.BufferGeometry();
  const rpos = new Float32Array(RCOUNT * 3);
  const rSpeed = new Float32Array(RCOUNT);
  const rOffset = new Float32Array(RCOUNT);
  const rRand = new Float32Array(RCOUNT);
  for (let i = 0; i < RCOUNT; i++) {
    rpos[i * 3] = (Math.random() - 0.5) * 60;
    rpos[i * 3 + 1] = Math.random() * 30;
    rpos[i * 3 + 2] = (Math.random() - 0.5) * 40 - 12;
    rSpeed[i] = Math.random();
    rOffset[i] = Math.random();
    rRand[i] = Math.random();
  }
  rgeo.setAttribute("position", new THREE.BufferAttribute(rpos, 3));
  rgeo.setAttribute("aSpeed", new THREE.BufferAttribute(rSpeed, 1));
  rgeo.setAttribute("aOffset", new THREE.BufferAttribute(rOffset, 1));
  rgeo.setAttribute("aRand", new THREE.BufferAttribute(rRand, 1));
  const rainMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.NormalBlending,
    uniforms: {
      uTime: { value: 0 }, uIntensity: { value: 0.5 }, uOpacity: { value: 0.0 },
      uTilt: { value: 0.0 }
    },
    vertexShader: [
      "uniform float uTime, uIntensity, uTilt;",
      "attribute float aSpeed, aOffset, aRand;",
      "varying float vRand, vA;",
      "void main(){",
      "  vec3 p = position;",
      "  float fall = mod(uTime*(1.4 + aSpeed*2.4) + aOffset, 1.0);",
      "  p.y = 16.0 - fall*34.0;",
      "  p.x += uTilt * (16.0 - p.y);",
      "  vec4 mv = modelViewMatrix * vec4(p, 1.0);",
      "  float size = mix(1.1, 5.5, uIntensity);",
      "  gl_PointSize = size * (340.0 / -mv.z);",
      "  gl_Position = projectionMatrix * mv;",
      "  vRand = aRand;",
      "  vA = mix(0.10, 0.62, uIntensity);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform float uIntensity, uOpacity; varying float vRand, vA;",
      "void main(){",
      "  if (vRand > 0.12 + uIntensity*0.88) discard;",
      "  vec2 c = gl_PointCoord - vec2(0.5);",
      "  float d = length(c * vec2(2.4, 1.0));",
      "  if (d > 0.5) discard;",
      "  float a = smoothstep(0.5, 0.0, d) * vA * uOpacity;",
      "  gl_FragColor = vec4(0.74, 0.83, 1.0, a);",
      "}"
    ].join("\n")
  });
  const rain = new THREE.Points(rgeo, rainMat);
  rain.frustumCulled = false;
  scene.add(rain);

  // ---------- 日月辉光（Sprite，加色混合） ----------
  const sunMat = new THREE.SpriteMaterial({
    map: sprite, color: 0xffd9a0, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const sun = new THREE.Sprite(sunMat);
  sun.scale.set(26, 26, 1);
  sun.position.set(7, 9, -22);
  scene.add(sun);

  const moonMat = new THREE.SpriteMaterial({
    map: sprite, color: 0xbfd4ff, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const moon = new THREE.Sprite(moonMat);
  moon.scale.set(14, 14, 1);
  moon.position.set(8, 10, -22);
  scene.add(moon);

  // ---------- 水面波纹 ----------
  const waterGeo = new THREE.PlaneGeometry(120, 80, 1, 1);
  const waterMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uIntensity: { value: 0.3 }, uTint: { value: new THREE.Color(0.10, 0.18, 0.30) } },
    vertexShader: [
      "varying vec2 vUv;",
      "void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }"
    ].join("\n"),
    fragmentShader: [
      "uniform float uTime, uIntensity; uniform vec3 uTint; varying vec2 vUv;",
      "void main(){",
      "  vec2 uv = vUv * 10.0;",
      "  float w = sin(uv.x*3.0 + uTime*2.0) * 0.5 + sin(uv.y*2.5 - uTime*1.7) * 0.5;",
      "  w += sin((uv.x+uv.y)*4.0 + uTime*3.0) * 0.25;",
      "  w *= (0.25 + uIntensity*0.9);",
      "  float shade = 0.05 + w*0.07 + uIntensity*0.06;",
      "  vec3 col = uTint + shade * vec3(0.45, 0.6, 1.0);",
      "  gl_FragColor = vec4(col, 1.0);",
      "}"
    ].join("\n")
  });
  const water = new THREE.Mesh(waterGeo, waterMat);
  water.rotation.x = -Math.PI / 2;
  water.position.y = -6.5;
  scene.add(water);

  // ---------- 天气状态机 ----------
  const T = { clear: 0, cloudy: 0, fog: 0, rain: 0, snow: 0, thunder: 0, isDay: 1, intensity: 0.4 };
  const C = { clear: 0, cloudy: 0, fog: 0, rain: 0, snow: 0, thunder: 0, isDay: 1, intensity: 0.4, tilt: 0 };
  let skyTop = new THREE.Color(0.13, 0.16, 0.22);
  let skyBottom = new THREE.Color(0.30, 0.35, 0.42);

  const PALETTES = {
    clearDay:   [[0.16, 0.42, 0.77], [0.74, 0.88, 1.0]],
    clearNight: [[0.02, 0.04, 0.10], [0.10, 0.14, 0.26]],
    cloudyDay:  [[0.30, 0.36, 0.47], [0.55, 0.62, 0.73]],
    cloudyNight:[[0.05, 0.07, 0.11], [0.14, 0.18, 0.27]],
    fog:        [[0.62, 0.66, 0.71], [0.82, 0.85, 0.88]],
    rain:       [[0.12, 0.15, 0.21], [0.28, 0.33, 0.41]],
    thunder:    [[0.07, 0.05, 0.15], [0.20, 0.16, 0.34]]
  };

  function pickState() {
    const order = [["thunder", T.thunder], ["rain", T.rain], ["snow", T.snow],
                   ["fog", T.fog], ["cloudy", T.cloudy], ["clear", T.clear]];
    let best = "clear", bv = -1;
    for (const [k, v] of order) { if (v > bv) { bv = v; best = k; } }
    return best;
  }
  function targetPalette() {
    const s = pickState();
    const key = (s === "clear") ? (T.isDay ? "clearDay" : "clearNight")
             : (s === "cloudy") ? (T.isDay ? "cloudyDay" : "cloudyNight") : s;
    return PALETTES[key] || PALETTES.rain;
  }

  function setTargets(type, intensity, isDay) {
    T.clear = type === "clear" ? 1 : 0;
    T.cloudy = type === "cloudy" ? 1 : 0;
    T.fog = type === "fog" ? 1 : 0;
    T.rain = (type === "rain" || type === "thunder") ? 1 : 0;
    T.snow = type === "snow" ? 1 : 0;
    T.thunder = type === "thunder" ? 1 : 0;
    T.intensity = intensity;
    T.isDay = isDay ? 1 : 0;
  }

  const WMO = {
    0: ["晴", "clear", 0.0], 1: ["晴间多云", "clear", 0.25],
    2: ["多云", "cloudy", 0.4], 3: ["阴", "cloudy", 0.85],
    45: ["雾", "fog", 0.7], 48: ["雾凇", "fog", 0.8],
    51: ["小毛毛雨", "rain", 0.22], 53: ["毛毛雨", "rain", 0.32], 55: ["大毛毛雨", "rain", 0.45],
    56: ["冻毛毛雨", "rain", 0.35], 57: ["强冻毛毛雨", "rain", 0.5],
    61: ["小雨", "rain", 0.45], 63: ["中雨", "rain", 0.7], 65: ["大雨", "rain", 0.95],
    66: ["冻雨", "rain", 0.6], 67: ["强冻雨", "rain", 0.85],
    71: ["小雪", "snow", 0.4], 73: ["中雪", "snow", 0.7], 75: ["大雪", "snow", 1.0], 77: ["雪粒", "snow", 0.5],
    80: ["小阵雨", "rain", 0.55], 81: ["阵雨", "rain", 0.75], 82: ["强阵雨", "rain", 1.0],
    85: ["小阵雪", "snow", 0.6], 86: ["大阵雪", "snow", 0.9],
    95: ["雷阵雨", "thunder", 0.85], 96: ["雷暴伴雹", "thunder", 1.0], 99: ["强雷暴伴雹", "thunder", 1.0]
  };

  function applyWeather(code, isDay, temp) {
    const w = WMO[code] || ["多云", "cloudy", 0.5];
    setTargets(w[1], w[2], isDay);
    const tempTxt = (typeof temp === "number") ? (" · " + temp.toFixed(0) + "°C") : "";
    locEl.textContent = "当地实时天气：" + w[0] + tempTxt + (isDay ? " · 昼" : " · 夜") + " · 背景已同步";
  }

  // 闪电
  let nextStrike = 4 + Math.random() * 6;
  function maybeLightning(dt) {
    if (C.thunder < 0.5) return;
    nextStrike -= dt;
    if (nextStrike <= 0) {
      nextStrike = 3 + Math.random() * 7;
      flashEl.style.opacity = (0.55 + Math.random() * 0.35).toFixed(2);
      setTimeout(function () { flashEl.style.opacity = "0"; }, 110 + Math.random() * 120);
    }
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onResize);

  let running = true;
  let rafActive = false;
  function startLoop() {
    if (rafActive) return;          // 单例守卫：任意时刻仅一个 rAF 循环
    rafActive = true;
    last = performance.now();
    requestAnimationFrame(animate);
  }
  document.addEventListener("visibilitychange", function () {
    running = !document.hidden;
    if (running) startLoop();
  });

  let last = performance.now();
  function animate(now) {
    if (!running) { rafActive = false; return; }
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    const time = now * 0.001;
    const k = 0.04;
    C.clear += (T.clear - C.clear) * k;
    C.cloudy += (T.cloudy - C.cloudy) * k;
    C.fog += (T.fog - C.fog) * k;
    C.rain += (T.rain - C.rain) * k;
    C.snow += (T.snow - C.snow) * k;
    C.thunder += (T.thunder - C.thunder) * k;
    C.isDay += (T.isDay - C.isDay) * 0.02;
    C.intensity += (T.intensity - C.intensity) * 0.02;
    C.tilt = C.intensity * 0.28;

    // 系统透明度
    sunMat.opacity = C.clear * C.isDay * 0.9;
    moonMat.opacity = C.clear * (1 - C.isDay) * 0.8;
    stars.material.uniforms.uOpacity.value = C.clear * (1 - C.isDay);
    dust.material.uniforms.uOpacity.value = C.clear * C.isDay * 0.5;
    clouds.material.uniforms.uOpacity.value = Math.max(C.cloudy, C.rain * 0.6, C.thunder * 0.6, C.snow * 0.4);
    rainMat.uniforms.uOpacity.value = Math.max(C.rain, C.thunder);
    rainMat.uniforms.uIntensity.value = C.intensity;
    rainMat.uniforms.uTilt.value = C.tilt;
    snow.material.uniforms.uOpacity.value = C.snow;
    snow.material.uniforms.uIntensity.value = C.intensity;
    waterMat.uniforms.uIntensity.value = 0.2 + C.intensity * 0.9 + C.thunder * 0.4;
    // 水色随天气：晴偏暖、雷暴偏紫
    waterMat.uniforms.uTint.value.setRGB(
      0.06 + C.thunder * 0.06,
      0.14 + C.clear * C.isDay * 0.06,
      0.26 + C.thunder * 0.10
    );
    fogEl.style.opacity = (C.fog * 0.7).toFixed(3);

    // 天空渐变 lerp
    const pal = targetPalette();
    skyTop.lerp(new THREE.Color(pal[0][0], pal[0][1], pal[0][2]), 0.03);
    skyBottom.lerp(new THREE.Color(pal[1][0], pal[1][1], pal[1][2]), 0.03);
    skyMat.uniforms.uTop.value.copy(skyTop);
    skyMat.uniforms.uBottom.value.copy(skyBottom);

    // 更新 uTime
    [snow, clouds, dust, stars].forEach(function (p) { p.material.uniforms.uTime.value = time; });
    rainMat.uniforms.uTime.value = time;
    waterMat.uniforms.uTime.value = time;

    // 相机轻微漂移
    camera.position.x = Math.sin(time * 0.12) * 0.6;
    camera.lookAt(0, 0, -6);

    maybeLightning(dt);

    renderer.clear();
    renderer.render(skyScene, skyCam);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  startLoop();

  // ---------- 实时天气获取 ----------
  async function getWeather() {
    try {
      const ip = await fetch("https://ipapi.co/json/").then(function (r) { return r.json(); });
      const lat = ip.latitude, lon = ip.longitude;
      const url = "https://api.open-meteo.com/v1/forecast?latitude=" + lat +
        "&longitude=" + lon + "&current=weather_code,temperature_2m,is_day";
      const meteo = await fetch(url).then(function (r) { return r.json(); });
      const cur = meteo.current || {};
      const code = cur.weather_code != null ? cur.weather_code : 3;
      const isDay = cur.is_day === 1;
      applyWeather(code, isDay, cur.temperature_2m);
    } catch (e) {
      setTargets("cloudy", 0.5, 1);
      locEl.textContent = "无法获取当地天气，已使用默认多云背景";
    }
  }
  getWeather();
})();
</script>
</body>
</html>
