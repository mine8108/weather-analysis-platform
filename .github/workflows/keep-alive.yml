name: Keep Streamlit App Alive

on:
  schedule:
    # 每 5 分钟 ping 一次，重置 Community Cloud 的闲置计时器，防止休眠
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Streamlit app
        run: |
          URL="https://weather-analysis-platform-zyappduswtwhs8pok7e7a9c.streamlit.app"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 5
          done
          echo "ping failed after retries"
          exit 1
