name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 安全修复（SEC-30）：最小权限，避免上游 action 被攻破时拿到写权限
permissions:
  contents: read

jobs:
  regression:
    name: 回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 安全修复（SEC-30）：pin 到 40 位 commit SHA（v4 / v5 对应 tag）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt -r requirements-dev.txt

      - name: 依赖一致性检查
        run: python -m pip check

      - name: 依赖漏洞扫描（SEC-04，阻断）
        # 审计整个已安装环境（含传递依赖），发现漏洞即失败
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: 认证与多租户回归（P0/P1）
        run: python -B tests/test_auth_session.py

      - name: 数据质控回归（R-09/R-16）
        run: python -B tests/test_data_quality.py

      - name: 预警引擎回归（R-14/R-29~R-40）
        run: python -B tests/test_analyzer.py

      - name: 报文解码回归（R-15）
        run: python -B tests/test_codec.py

      - name: AQI 口径回归（2.3.8）
        run: python -B tests/test_aqi.py

      - name: ERA5 catalogue 与脚本包回归（2.3.8）
        run: python -B tests/test_era5_guide.py

      - name: 用户手册内容契约（2.3.8）
        run: python -B tests/test_manual.py

      - name: AI 读图解析回归（2.3.8）
        run: python -B tests/test_chart_reader.py

      - name: 读图配额与 schema 安全契约（2.3.8）
        run: python -B tests/test_vision_quota.py

      - name: Supabase 后端契约（自检/缓存 RPC/配额）
        run: python -B tests/test_supabase_backend.py

      - name: 发布面契约（版本/依赖/Secrets/CI）
        run: python -B tests/test_release_surface.py

      - name: 会话状态注册表校验
        run: python -B research/check_state_registry.py

      - name: CSS 变量引用完整性
        run: python -B research/check_py_vars.py

      - name: 图表颜色与 Plotly CSS 变量检查
        run: |
          python -B research/check_chart_colors.py
          python -B research/check_plotly_cssvar.py

      # 全量回归：批次 0 起改为阻断。含 AppTest 启动冒烟与天气墙用例。
      - name: 全量回归（阻断）
        run: python -m pytest tests -q
