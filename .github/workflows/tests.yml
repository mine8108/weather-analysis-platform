name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: 回归测试
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 认证与多租户回归（P0/P1）
        run: python -B tests/test_auth_session.py

      - name: 数据质控回归（R-09/R-16）
        run: python -B tests/test_data_quality.py

      - name: 预警引擎回归（R-14/R-29~R-40）
        run: python -B tests/test_analyzer.py

      - name: 报文解码回归（R-15）
        run: python -B tests/test_codec.py

      - name: AQI 口径回归（2.3.8）
        run: python -B tests/test_aqi.py

      - name: ERA5 catalogue 与脚本包回归（2.3.8）
        run: python -B tests/test_era5_guide.py

      - name: 用户手册内容契约（2.3.8）
        run: python -B tests/test_manual.py

      - name: AI 读图解析回归（2.3.8）
        run: python -B tests/test_chart_reader.py

      - name: 读图配额与 schema 安全契约（2.3.8）
        run: python -B tests/test_vision_quota.py

      - name: Supabase 后端契约（自检/缓存 RPC/配额）
        run: python -B tests/test_supabase_backend.py

      - name: 发布面契约（版本/依赖/Secrets/CI）
        run: python -B tests/test_release_surface.py

      # 全量回归：批次 0 起改为阻断。含 AppTest 启动冒烟与天气墙用例。
      - name: 全量回归（阻断）
        run: python -m pytest tests -q
