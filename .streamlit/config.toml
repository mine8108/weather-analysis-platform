[server]
headless = true
port = 8501
# 安全修复（R-24）：CORS 恢复 Streamlit 默认值 true，避免任意第三方站点
# 借访客浏览器访问本应用接口；XSRF 保护保持开启。
enableCORS = true
enableXsrfProtection = true
# 安全修复（SEC-03/31）：与业务层 20MB 上限对齐，作为服务器层兜底
maxUploadSize = 20

[client]
# 安全修复（SEC-12）：不把未捕获异常的完整 traceback 渲染到浏览器
showErrorDetails = "none"

[theme]
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"
textColor = "#0f172a"
font = "sans serif"

[browser]
gatherUsageStats = false
